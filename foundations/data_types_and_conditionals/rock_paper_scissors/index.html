<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <script src="javascript.js" defer></script>
  </head>
  <body>
    <h1>Rock, Paper, Scissors</h1>
    <div>
      <button id="rpsShoot">Shoot!</button>
    </div>
    <div>
      <button class="weapon" data-choice="Rock">Rock</button>
      <button class="weapon" data-choice="Paper">Paper</button>
      <button class="weapon" data-choice="Scissors">Scissors</button>
      <p>Choose your weapon.</p>
    </div>
    <div class="results"></div>
  </body>
</html>
